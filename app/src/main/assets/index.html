 if(sx.status==='ahead')return '<span class="asp-badge b-ahead">Ahead</span>';
 if(sx.status==='ok')return '<span class="asp-badge b-ok">On track</span>';
 var r=[];if(sx.behind)r.push('Behind schedule');if(sx.weak)r.push('Weak in mocks');return '<span class="asp-badge b-lag">'+r.join(' + ')+'</span>';
}
function bar(c,tot){
 if(!tot)return '<div class="asp-bar"></div>';
 return '<div class="asp-bar" role="img" aria-label="'+c[3]+' revised, '+c[2]+' done, '+c[1]+' learning, '+c[0]+' not started"><i class="s3" style="width:'+c[3]/tot*100+'%"></i><i class="s2" style="width:'+c[2]/tot*100+'%"></i><i class="s1" style="width:'+c[1]/tot*100+'%"></i></div>';
}
var pct0=function(v){return Math.round(v)+'%'};
function examBar(){
 var h='<div class="asp-exams">';
 A.exams.forEach(function(e){h+='<button class="asp-chip'+(e.id===(cur()||{}).id?' on':'')+'" data-act="pick" data-id="'+e.id+'">'+esc(e.name)+'</button>'});
 h+='<button class="asp-chip add" data-act="addExam">+ Add exam</button></div>';
 if(ui.adding)h+=examForm(null);

function welcome(){

 else paceTxt='The revision buffer has started and <b>'+an.rem+' topics</b> are still left. Finish the most important ones first.';

 h+='</div>';

 an.laggingItems.forEach(function(li){if(!li.sx.tot){h+='<p class="hint">Add topics for '+esc(li.sx.s.name)+' in Syllabus so the app can tell you what to work on.</p>'}if(li.list.length){h+='<h4>Topics to work on in '+esc(li.sx.s.name)+'</h4>';li.list.forEach(function(f){h+='<div class="asp-focus sm"><div><b>'+esc(f.t.name)+'</b><small>'+esc(f.c.name)+' · '+esc(f.why)+'</small></div></div>'})}});

 an.subs.forEach(function(sx){

  if(isEdit('subj',s.id))h+=editRow('subj',s.id,s.name,'Subject name');

    h+='<div class="asp-chap"><div class="asp-chaphead">'+(isEdit('chap',c.id)?'':'<b>'+esc(c.name)+'</b>')+'<span class="asp-mini"><button data-act="edit" data-k="chap" data-id="'+c.id+'" aria-label="Rename chapter">✎</button><button class="asp-danger" data-act="delChap" data-id="'+c.id+'" aria-label="Delete chapter">✕</button></span></div>';
    if(isEdit('chap',c.id))h+=editRow('chap',c.id,c.name,'Chapter name');
    vis.forEach(function(t){
     h+='<div class="asp-topic">'+(isEdit('topic',t.id)?editRow('topic',t.id,t.name,'Topic name'):'<button class="asp-st s'+t.st+'" data-act="adv" data-id="'+t.id+'" aria-label="Status: '+ST[t.st]+'. Tap to change">'+ST[t.st]+'</button><span class="asp-tn">'+esc(t.name)+(an.weakCount[t.id]&&t.st<3?' <em>weak</em>':'')+'</span><span class="asp-mini"><button data-act="edit" data-k="topic" data-id="'+t.id+'" aria-label="Rename topic">✎</button><button class="asp-danger" data-act="delTopic" data-id="'+t.id+'" aria-label="Delete topic">✕</button></span>')+'</div>';

function mocks(ex,an){
 var h='';
 if(!ex.subjects.length)return '<div class="asp-card"><p class="hint">Add subjects in the Syllabus tab first. Mock scores are logged subject by subject.</p><button class="primary" data-sub="Syllabus">Go to Syllabus</button></div>';
 var last=an.mocks[an.mocks.length-1],n=ex.mocks.length+1;
 h+='<div class="asp-card"><h3>Log a mock test</h3><label class="asp-l">Test name<input id="asp-mname" maxlength="80" value="Mock '+n+'"></label><label class="asp-l">Date<input id="asp-mdate" type="date" max="'+today()+'" value="'+today()+'"></label><p class="hint">Enter marks you got and the maximum for each subject. Leave a subject empty if it was not in this test.</p>';
 ex.subjects.forEach(function(s){var lx=last&&last.scores[s.id]?last.scores[s.id].x:'';h+='<div class="asp-score"><b>'+esc(s.name)+'</b><input id="asp-m-'+s.id+'" type="number" step="any" inputmode="decimal" placeholder="Marks" aria-label="'+esc(s.name)+' marks"><span>/</span><input id="asp-x-'+s.id+'" type="number" step="any" min="1" inputmode="decimal" placeholder="Max" value="'+lx+'" aria-label="'+esc(s.name)+' maximum marks"></div>'});
 var pend=an.all.filter(function(o){return o.t.st<3});
 if(pend.length){h+='<details class="asp-weak"><summary>Mark weak topics (optional)</summary><p class="hint">Topics you struggled with in this test. They get priority in Focus today.</p>';
  ex.subjects.forEach(function(s){var ts=pend.filter(function(o){return o.s.id===s.id});if(!ts.length)return;h+='<h4>'+esc(s.name)+'</h4>';ts.slice(0,300).forEach(function(o){h+='<label class="asp-chk"><input type="checkbox" class="asp-wt" value="'+o.t.id+'"> '+esc(o.t.name)+'</label>'})});
  h+='</details>'}
 h+='<button class="primary" data-act="addMock">Save mock test</button>'+(ui.msg?'<p class="asp-err">'+esc(ui.msg)+'</p>':'')+'</div>';
 if(!an.mocks.length)return h+'<p class="hint">No mock tests yet. Log your first one above to see subject-wise trends.</p>';
 var tv=an.mocks.map(totalPct).filter(function(v){return v!=null});
 h+='<div class="asp-card"><h3>Subject-wise results</h3><div class="asp-trow asp-th"><span>Subject</span><span>Avg</span><span>Last</span><span>Best</span><span>Trend</span></div>';
 var tavg=tv.reduce(function(a,b){return a+b},0)/tv.length;
 h+='<div class="asp-trow"><b>Overall</b><span>'+pct0(tavg)+'</span><span>'+pct0(tv[tv.length-1])+'</span><span>'+pct0(Math.max.apply(null,tv))+'</span><span>'+spark(tv,90,30)+'</span></div>';
 ex.subjects.forEach(function(s){
  var v=an.mocks.map(function(m){return mockPct(m,s.id)}).filter(function(x){return x!=null});if(!v.length)return;
  var avg=v.reduce(function(a,b){return a+b},0)/v.length,d=v.length>1?v[v.length-1]-v[v.length-2]:0;
  h+='<div class="asp-trow"><b>'+esc(s.name)+'</b><span>'+pct0(avg)+'</span><span>'+pct0(v[v.length-1])+(v.length>1?'<em class="'+(d>=0?'up':'dn')+'">'+(d>=0?'▲':'▼')+Math.round(Math.abs(d))+'</em>':'')+'</span><span>'+pct0(Math.max.apply(null,v))+'</span><span>'+spark(v,90,30)+'</span></div>';
 });
 var weakest=an.subs.filter(function(x){return x.avg!=null}).sort(function(a,b){return a.avg-b.avg})[0],best=an.subs.filter(function(x){return x.avg!=null}).sort(function(a,b){return b.avg-a.avg})[0];
 if(weakest&&best&&weakest!==best)h+='<p class="hint">Weakest subject lately: <b>'+esc(weakest.s.name)+'</b> ('+pct0(weakest.avg)+'). Strongest: <b>'+esc(best.s.name)+'</b> ('+pct0(best.avg)+'). Based on the last 3 tests per subject.</p>';

  var wk=m.weak.map(function(i){var o=an.all.find(function(a){return a.t.id===i});return o?esc(o.t.name):null}).filter(Boolean);
  if(wk.length)h+='<small>Weak: '+wk.join(', ')+'</small>';
